<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logo Maria Luisa</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
    }
    .preview-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .ml-logo-anim {
      width: 100%;
      max-width: 450px;
    }
    .ml-logo-anim path {
      fill: #1a1a1a;
    }
  </style>
</head>
<body>
  <main class="preview-stage">
    <div class="ml-logo-anim" id="ml-logo-anim"></div>
  </main>

  <script src="dist/flubber.min.js"></script>
  <script src="dist/logo-animato.js"></script>
</body>
</html>
